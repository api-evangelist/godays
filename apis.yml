name: GoDays
description: >-
  GoDays is an AI-powered workforce analytics platform for enterprises that
  predicts and helps prevent employee burnout. It analyzes internal company
  data — keyboard usage behaviors, employee sentiment, interactions,
  performance, and feedback — to measure and forecast burnout risk, then
  surfaces recommendations to improve workflow, productivity, and employee
  wellbeing. Founded in 2021 and based in Seoul (Gangnam), South Korea, the
  company was co-founded by CEO Yelnur Kai and Adiar Bopov, and raised a seed
  round in 2024 with participation from 500 Global and Domino VC. GoDays was
  added to the API Evangelist network as a 500 Global portfolio company; as of
  this enrichment pass it publishes a marketing site only, with no public API,
  developer portal, or specification surface.
